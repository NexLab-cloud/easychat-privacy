<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="index, follow" />
<title>Easy Chat — Legal Documents</title>
<style>
  :root {
    --green: #25D366;
    --green-deep: #128C7E;
    --ink: #1c1c1e;
    --muted: #5b6169;
    --line: #e6e8eb;
    --bg: #ffffff;
    --card: #f7f9fa;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, var(--green) 0%, var(--green-deep) 55%, #0a5c2e 100%);
    background-size: 220% 220%;
    animation: drift 14s ease-in-out infinite;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  @keyframes drift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(40px);
    opacity: 0.18;
    background: #ffffff;
    pointer-events: none;
    z-index: 0;
  }
  .blob1 { width: 260px; height: 260px; top: -60px; left: -60px; animation: float1 9s ease-in-out infinite; }
  .blob2 { width: 200px; height: 200px; bottom: -40px; right: -40px; animation: float2 11s ease-in-out infinite; }
  .blob3 { width: 140px; height: 140px; top: 40%; right: 8%; animation: float1 7.5s ease-in-out infinite; }
  @keyframes float1 {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(24px, 30px); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(-20px, -26px); }
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
    padding: 56px 20px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .icon {
    width: 84px; height: 84px;
    border-radius: 22px;
    background: rgba(255,255,255,0.16);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 20px;
    opacity: 0;
    animation: pop 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.3) 0.1s forwards,
               bob 3.2s ease-in-out 0.8s infinite;
  }
  .icon img { width: 56px; height: 56px; display: block; }
  @keyframes pop {
    from { opacity: 0; transform: scale(0.6) translateY(10px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  h1 {
    color: #fff;
    font-size: 26px;
    font-weight: 800;
    margin: 0 0 6px;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.25s forwards;
  }
  .tagline {
    color: rgba(255,255,255,0.88);
    font-size: 14px;
    margin: 0 0 34px;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.35s forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card {
    width: 100%;
    background: var(--bg);
    border-radius: 20px;
    padding: 22px 22px 18px;
    margin-bottom: 16px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.16);
    text-align: left;
    opacity: 0;
    transform: translateY(16px);
    animation: fadeUp 0.55s ease forwards;
  }
  .card:nth-of-type(1) { animation-delay: 0.45s; }
  .card:nth-of-type(2) { animation-delay: 0.58s; }

  .card h2 {
    font-size: 16px;
    margin: 0 0 4px;
    color: var(--ink);
  }
  .card .sub {
    font-size: 12.5px;
    color: var(--muted);
    margin: 0 0 16px;
  }
  .links {
    display: flex;
    gap: 10px;
  }
  .links a {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 700;
    padding: 11px 10px;
    border-radius: 12px;
    border: 1.5px solid var(--line);
    color: var(--green-deep);
    background: var(--card);
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .links a:hover {
    background: #eafaf0;
    border-color: var(--green);
    transform: translateY(-1px);
  }
  .links a:active { transform: translateY(0); }
  .flag { font-size: 15px; }

  footer {
    position: relative;
    z-index: 1;
    color: rgba(255,255,255,0.75);
    font-size: 12.5px;
    padding: 8px 20px 32px;
    text-align: center;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.7s forwards;
  }
  footer a { color: #fff; }
</style>
</head>
